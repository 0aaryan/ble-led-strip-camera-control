<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>LED Strip Helper</title>
  <style>
    body{font-family:system-ui,Segoe UI,Roboto,Arial;margin:20px}
    .hidden{display:none}
    .card{border:1px solid #ddd;padding:16px;border-radius:8px;max-width:800px}
    button{margin:4px}
    li{margin:6px 0}
  </style>
</head>
<body>
  <h1>LED Strip Helper</h1>

  <div id="landing" class="card">
    <h2>Welcome</h2>
    <p>This app helps you scan BLE devices and use your laptop camera to detect LED brightness changes.</p>
    <p>
      <button id="btn-scan">Scan Bluetooth Devices</button>
      <button id="btn-open-camera">Choose Camera (in browser)</button>
    </p>
  </div>

  <div id="ble-scan" class="card hidden">
    <h2>Scan Results</h2>
    <p>Click <button id="btn-rescan">Rescan</button> to run scan again.</p>
    <ul id="devices"></ul>
    <p><button id="btn-back-from-scan">Back</button></p>
  </div>

  <div id="device-selected" class="card hidden">
    <h2>Device Selected</h2>
    <p id="device-info"></p>
    <p><button id="btn-choose-camera-next">Next: Choose Camera</button>
    <button id="btn-back-to-scan">Back to Scan</button></p>
  </div>

  <div id="camera-setup" class="card hidden">
    <h2>Camera</h2>
    <p>Select camera and preview. Then start brightness monitoring.</p>
    <p>
      <select id="camera-list"></select>
      <button id="btn-start-preview">Start Preview</button>
      <button id="btn-stop-preview">Stop</button>
    </p>
    <video id="video" width="640" height="360" autoplay muted playsinline style="border:1px solid #ccc"></video>
    <p>
      <label>Threshold (absolute 0-255): <input id="threshold" type="number" value="15" /></label>
      <button id="btn-start-monitor">Start Monitor</button>
      <button id="btn-stop-monitor">Stop Monitor</button>
    </p>
    <p>Brightness: <span id="brightness">n/a</span></p>
    <p><button id="btn-back-to-device">Back</button></p>
  </div>

  <canvas id="canvas" width="640" height="360" class="hidden"></canvas>

  <script>
    // Simple client-side flow and camera brightness detector.
    const landing = document.getElementById('landing')
    const bleScan = document.getElementById('ble-scan')
    const devicesList = document.getElementById('devices')
    const deviceSelected = document.getElementById('device-selected')
    const deviceInfo = document.getElementById('device-info')
    const cameraSetup = document.getElementById('camera-setup')

    const btnScan = document.getElementById('btn-scan')
    const btnRescan = document.getElementById('btn-rescan')
    const btnBackFromScan = document.getElementById('btn-back-from-scan')
    const btnBackToScan = document.getElementById('btn-back-to-scan')
    const btnChooseCameraNext = document.getElementById('btn-choose-camera-next')
    const btnOpenCamera = document.getElementById('btn-open-camera')

    let selectedDevice = null

    function show(el){ el.classList.remove('hidden') }
    function hide(el){ el.classList.add('hidden') }

    btnScan.onclick = () => { hide(landing); show(bleScan); scanDevices() }
    btnRescan.onclick = () => scanDevices()
    btnBackFromScan.onclick = () => { show(landing); hide(bleScan) }

    btnBackToScan.onclick = () => { hide(deviceSelected); show(bleScan) }
    btnChooseCameraNext.onclick = () => { hide(deviceSelected); show(cameraSetup); initCameraDevices() }
    btnOpenCamera.onclick = () => { hide(landing); show(cameraSetup); initCameraDevices() }

    async function scanDevices(){
      devicesList.innerHTML = '<li>Scanning…</li>'
      try{
        const res = await fetch('/api/scan?timeout=4')
        const arr = await res.json()
        devicesList.innerHTML = ''
        if(!arr.length) devicesList.innerHTML = '<li>No devices found</li>'
        arr.forEach(d => {
          const li = document.createElement('li')
          li.innerHTML = `<b>${d.name || '(no name)'}</b> — ${d.address} — RSSI: ${d.rssi ?? 'n/a'} `
          const btn = document.createElement('button')
          btn.textContent = 'Select'
          btn.onclick = () => selectDevice(d)
          li.appendChild(btn)
          devicesList.appendChild(li)
        })
      }catch(err){
        devicesList.innerHTML = '<li>Scan failed: '+err+'</li>'
      }
    }

    function selectDevice(d){
      selectedDevice = d
      deviceInfo.textContent = `${d.name || '(no name)'} — ${d.address} — RSSI: ${d.rssi ?? 'n/a'}`
      hide(bleScan); show(deviceSelected)
    }

    // Camera flow
    const camList = document.getElementById('camera-list')
    const btnStartPreview = document.getElementById('btn-start-preview')
    const btnStopPreview = document.getElementById('btn-stop-preview')
    const video = document.getElementById('video')
    const canvas = document.getElementById('canvas')
    const ctx = canvas.getContext('2d')
    const thresholdInput = document.getElementById('threshold')
    const btnStartMonitor = document.getElementById('btn-start-monitor')
    const btnStopMonitor = document.getElementById('btn-stop-monitor')
    const brightnessEl = document.getElementById('brightness')
    const btnBackToDevice = document.getElementById('btn-back-to-device')

    let stream = null
    let monitorTimer = null
    let baseline = null

    btnStartPreview.onclick = async () => {
      await startPreview()
    }
    btnStopPreview.onclick = () => stopPreview()
    btnBackToDevice.onclick = () => { hide(cameraSetup); show(deviceSelected) }

    async function initCameraDevices(){
      camList.innerHTML = ''
      try{
        const devices = await navigator.mediaDevices.enumerateDevices()
        const cams = devices.filter(d => d.kind === 'videoinput')
        cams.forEach((c, idx) => {
          const opt = document.createElement('option')
          opt.value = c.deviceId
          opt.textContent = c.label || ('Camera '+(idx+1))
          camList.appendChild(opt)
        })
      }catch(err){
        camList.innerHTML = '<option>enumeration failed</option>'
      }
    }

    async function startPreview(){
      stopPreview()
      const deviceId = camList.value || undefined
      try{
        stream = await navigator.mediaDevices.getUserMedia({video: deviceId ? {deviceId: {exact: deviceId}} : true, audio:false})
        video.srcObject = stream
        video.play()
      }catch(err){
        alert('Failed to open camera: '+err)
      }
    }

    function stopPreview(){
      if(stream){
        stream.getTracks().forEach(t => t.stop())
        stream = null
      }
      video.pause(); video.srcObject = null
      stopMonitor()
    }

    btnStartMonitor.onclick = () => {
      // capture baseline
      baseline = null
      if(!stream){ startPreview().then(()=>captureBaseline()) }
      else captureBaseline()
    }
    btnStopMonitor.onclick = () => stopMonitor()

    function captureBaseline(){
      let samples = []
      const n = 20
      let taken = 0
      const t = setInterval(()=>{
        if(video.readyState < 2){ return }
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height)
        const data = ctx.getImageData(0,0,canvas.width,canvas.height).data
        let sum = 0
        for(let i=0;i<data.length;i+=4){ sum += (0.299*data[i] + 0.587*data[i+1] + 0.114*data[i+2]) }
        const mean = sum / (canvas.width*canvas.height)
        samples.push(mean)
        taken++
        brightnessEl.textContent = mean.toFixed(1)
        if(taken >= n){ clearInterval(t); baseline = samples.reduce((a,b)=>a+b,0)/samples.length; startMonitorLoop(); }
      }, 100)
    }

    function startMonitorLoop(){
      const thresh = Number(thresholdInput.value) || 15
      monitorTimer = setInterval(()=>{
        if(video.readyState < 2) return
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height)
        const data = ctx.getImageData(0,0,canvas.width,canvas.height).data
        let sum = 0
        for(let i=0;i<data.length;i+=4){ sum += (0.299*data[i] + 0.587*data[i+1] + 0.114*data[i+2]) }
        const mean = sum / (canvas.width*canvas.height)
        brightnessEl.textContent = mean.toFixed(1)
        const diff = mean - baseline
        if(Math.abs(diff) >= thresh){
          console.log('Change detected', mean, diff)
          // We could notify backend here or save snapshot
          baseline = baseline*0.9 + mean*0.1
        }
      }, 150)
    }

    function stopMonitor(){
      if(monitorTimer){ clearInterval(monitorTimer); monitorTimer = null }
    }

    // Initialize minimal state
    (async ()=>{ if(navigator && navigator.mediaDevices) await initCameraDevices() })()

  </script>
</body>
</html>
